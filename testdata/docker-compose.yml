# Local SQL Server with the rehearsal data. From this folder: docker compose up
# App connection string:
#   Server=localhost,1433;Database=EpiRehearsal;User Id=sa;Password=<MSSQL_SA_PASSWORD>;TrustServerCertificate=True
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            # runs on Apple Silicon via Rosetta in Docker Desktop
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rehearsal!Passw0rd}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQL_HOST: sqlserver
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rehearsal!Passw0rd}"
    volumes:
      - ./:/testdata:ro
    entrypoint: ["/bin/bash", "/testdata/init.sh"]
    restart: "no"
